name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # First attempt. continue-on-error so a transient GitHub Pages/artifact
      # flake ("No artifacts named github-pages... re-run at a later time") does
      # NOT fail the job and email everyone. (Shaquan 8/8: stop the failure spam.)
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 25
      # Retry once. If THIS also fails, the job fails for real (a genuine issue,
      # worth an email). Transient flakes self-heal here and stay silent.
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
